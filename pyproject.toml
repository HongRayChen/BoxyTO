[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxyto"
version = "0.1.0"
description = "Topology optimization for subtractive machining using trimmed neural fields"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "torch>=2.4", "pyvista>=0.44"]

[project.scripts]
boxyto = "boxyto.__main__:main"

[tool.setuptools.packages.find]
include = ["boxyto*"]
